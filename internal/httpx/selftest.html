<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>selftest: running</title>
<style>
  body { font: 14px/1.5 ui-monospace, monospace; margin: 2rem; }
  .pass { color: #14603a; } .fail { color: #a3141b; }
  table { border-collapse: collapse; margin-top: 1rem; }
  td, th { border: 1px solid #ccc; padding: .25rem .6rem; text-align: left; }
</style>
</head>
<body>
<h1>Canonical selftest</h1>
<p>Compares <code>canonical.js</code> against <code>internal/proof/testdata/enroll.json</code>.</p>
<p id="result">running…</p>
<table id="rows"><thead><tr><th>vector</th><th>result</th></tr></thead><tbody></tbody></table>
<script type="module">
import { normalizeCode, validCode, enrollCanonical } from '/__aivan/selftest/canonical.js';

const result = document.getElementById('result');
const tbody = document.querySelector('#rows tbody');

try {
  const vectors = await (await fetch('/__aivan/selftest/vectors.json')).json();
  let failed = 0;
  for (const v of vectors) {
    const code = normalizeCode(v.code);
    let ok = validCode(code);
    let got = ok ? enrollCanonical(code, v.alg, v.public_key) : '(invalid code)';
    ok = ok && got === v.expected;
    if (!ok) failed++;
    const tr = document.createElement('tr');
    const name = document.createElement('td');
    name.textContent = v.name;
    const verdict = document.createElement('td');
    verdict.textContent = ok ? 'match' : 'MISMATCH';
    verdict.className = ok ? 'pass' : 'fail';
    tr.append(name, verdict);
    tbody.append(tr);
  }
  const total = vectors.length;
  if (failed === 0) {
    result.textContent = `PASS: ${total} vectors introduced to the browser match Go.`;
    result.className = 'pass';
    document.title = 'selftest: pass';
  } else {
    result.textContent = `FAIL: ${failed} of ${total} vectors disagree.`;
    result.className = 'fail';
    document.title = 'selftest: fail';
  }
  document.body.dataset.selftest = failed === 0 ? 'pass' : 'fail';
} catch (err) {
  result.textContent = 'ERROR: ' + err;
  result.className = 'fail';
  document.title = 'selftest: error';
  document.body.dataset.selftest = 'error';
}
</script>
</body>
</html>
