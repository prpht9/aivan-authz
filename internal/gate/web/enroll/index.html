<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Enroll this device</title>

<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --fg: #1d1d1f;
    --muted: #6b6b70;
    --line: #d9d9de;
    --accent: #1f4fd8;
    --bad: #a3141b;
    --good: #14603a;
    --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131315;
      --fg: #ececef;
      --muted: #9a9aa2;
      --line: #33333a;
      --accent: #7fa2ff;
      --bad: #ff8f94;
      --good: #7fd6a6;
      --field: #1c1c20;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
  }
  main { width: 100%; max-width: 30rem; }
  h1 { font-size: 1.35rem; line-height: 1.25; margin: 0 0 .35rem; letter-spacing: -.01em; }
  .lede { color: var(--muted); margin: 0 0 1.75rem; }
  form { display: grid; gap: 1.1rem; }
  label { display: grid; gap: .4rem; font-weight: 550; font-size: .95rem; }
  label .hint { font-weight: 400; color: var(--muted); font-size: .85rem; }
  input[type=text] {
    font: 1.05rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: .06em;
    text-overflow: ellipsis;
    padding: .7rem .8rem;
    border: 1px solid var(--line);
    border-radius: .5rem;
    background: var(--field);
    color: var(--fg);
    width: 100%;
  }
  input[type=text]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  fieldset { border: 1px solid var(--line); border-radius: .5rem; padding: .85rem 1rem; margin: 0; }
  legend { font-weight: 550; font-size: .95rem; padding: 0 .35rem; }
  .choice { display: flex; gap: .6rem; align-items: flex-start; padding: .35rem 0; }
  .choice input { margin-top: .3rem; }
  .choice label { font-weight: 600; font-size: .95rem; }
  .choice span { display: grid; }
  .choice small { font-weight: 400; color: var(--muted); }
  button {
    font: inherit;
    font-weight: 600;
    padding: .8rem 1rem;
    border: 0;
    border-radius: .5rem;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: progress; }
  #status { min-height: 1.5rem; margin: 0; font-size: .95rem; }
  #status.bad { color: var(--bad); }
  #status.good { color: var(--good); }
  .meta { color: var(--muted); font-size: .82rem; margin-top: 2rem; }
  .meta code { font-size: .95em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Enroll this device</h1>
  <p class="lede">
    This browser will generate a key that it cannot export, prove it holds the
    key, and sign in. The key stays on this device.
  </p>

  <form id="enroll" novalidate>
    <label>
      Enrollment code
      <span class="hint">26 characters from the person who set up your account. Case and dashes do not matter.</span>
      <input id="code" name="code" type="text" autocomplete="one-time-code"
             autocapitalize="characters" spellcheck="false" inputmode="text"
             placeholder="XXXX-XXXX-XXXX-…" required>
    </label>

    <fieldset>
      <legend>This device</legend>
      <div class="choice">
        <input id="kind-browser" name="kind" type="radio" value="browser" checked>
        <label for="kind-browser">
          <span>Enroll this browser</span>
          <small>A key that browser profile keeps and cannot copy out.</small>
        </label>
      </div>
    </fieldset>

    <button id="go" type="submit">Enroll</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>

  <p class="meta" id="meta"></p>
</main>
<script type="module" src="/__aivan/enroll/app.js"></script>
</body>
</html>
