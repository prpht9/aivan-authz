# aivan-authz: the ingress auth service.
#
# Phase C adds /__aivan/verify (forwardAuth) and /__aivan/nonce. Phase D adds
# /__aivan/session, which is reached on the gate's own router rather than
# through forwardAuth: a cookie set on a forwardAuth 200 is not delivered to the
# browser without addAuthCookiesToResponse, and the request would have been
# consumed as an auth check. No application route is gated by it yet; Phase E
# wires the middleware into aivan-hud.
#
# Apply with kubectl, like the rest of this cluster's dev manifests.
apiVersion: v1
kind: Namespace
metadata:
  name: aivan
---
apiVersion: v1
kind: Secret
metadata:
  name: aivan-authz-db
  namespace: aivan
type: Opaque
stringData:
  # Placeholder. The real DSN is the aivan_authz service role, never the
  # migration role and never the application's credential. Replace this before
  # applying, or create the secret out of band:
  #   kubectl -n aivan create secret generic aivan-authz-db \
  #     --from-literal=AIVAN_DB_URL='postgres://aivan_authz@aivan-core-rw.aivan-core.svc/aivan_core'
  AIVAN_DB_URL: postgres://aivan_authz@REPLACE_ME/aivan_core
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aivan-authz-policy
  namespace: aivan
data:
  policy.yaml: |
    hosts:
      aivan-hud.home.arpa:
        routes:
          - { prefix: /admin, class: admin }
          - { prefix: /,      class: authenticated }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aivan-authz
  namespace: aivan
  labels: { app: aivan-authz }
spec:
  replicas: 2
  selector:
    matchLabels: { app: aivan-authz }
  template:
    metadata:
      labels: { app: aivan-authz }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: authz
          image: docker.home.arpa:5000/aivan-authz:latest
          imagePullPolicy: Always
          args: ["serve"]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: AIVAN_DB_URL
              valueFrom:
                secretKeyRef: { name: aivan-authz-db, key: AIVAN_DB_URL }
            - name: AIVAN_HOSTS
              value: aivan-hud.home.arpa
            - name: AIVAN_POLICY
              value: /etc/aivan/policy.yaml
            - name: AIVAN_LISTEN
              value: ":8080"
            # Session lifetimes, spec §5.4. The idle expiry slides and is
            # written back only when it moves more than 60 s, so a busy session
            # costs at most one write a minute. The absolute cap never moves.
            - name: AIVAN_SESSION_IDLE
              value: "15m"
            - name: AIVAN_SESSION_MAX
              value: "8h"
            # Phase C: the nonce rate limiter charges a request to the client
            # address only when the peer is one of these. It must match the
            # cluster's pod CIDR, or every request is charged to Traefik's pod
            # and one noisy client spends everyone's budget.
            #
            # Observed on this cluster (2026-11-13): the node's podCIDR is
            # 192.168.196.0/24 and every pod above is in it. Re-check with
            #   kubectl get nodes -o jsonpath='{.items[0].spec.podCIDR}'
            # if the cluster is rebuilt.
            - name: AIVAN_TRUSTED_PROXY_CIDRS
              value: "192.168.196.0/24"
          volumeMounts:
            - name: policy
              mountPath: /etc/aivan
              readOnly: true
            # The image's /tmp is not writable under a read-only root, and the
            # distroless image needs nothing else.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: policy
          configMap: { name: aivan-authz-policy }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aivan-authz
  namespace: aivan
spec:
  selector: { app: aivan-authz }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# The gate answers forwardAuth and the /__aivan/ endpoints. A direct path to it
# is a bypass unless a NetworkPolicy admits it, so the policy below admits
# Traefik and nothing else. Sessions make a second caller legitimate: an
# operator minting one from a pod in the aivan namespace with `authz
# list-devices` / `authz revoke` is exactly the console access the design
# wants. That access needs the aivan-authz Secret rather than a network hole, so
# the listener stays Traefik-only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aivan-authz-ingress
  namespace: aivan
spec:
  podSelector:
    matchLabels: { app: aivan-authz }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
      ports:
        - { protocol: TCP, port: 8080 }
---
# The gate makes outbound connections to Postgres and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aivan-authz-egress
  namespace: aivan
spec:
  podSelector:
    matchLabels: { app: aivan-authz }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: aivan-core }
      ports:
        - { protocol: TCP, port: 5432 }
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }