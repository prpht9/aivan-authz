# aivan-authz: the ingress auth service.
#
# Phase C adds /__aivan/verify (forwardAuth) and /__aivan/nonce. Phase D adds
# /__aivan/session, reached on the gate's own router rather than through
# forwardAuth: a cookie set on a forwardAuth 200 is not delivered to the browser
# without addAuthCookiesToResponse, and the request would have been consumed as
# an auth check. Phase E wires the middleware into aivan-hud, so this file and
# aivan-hud/deploy/routing.yaml are applied together.
#
# Namespace: Traefik refuses a Service in another namespace than the
# IngressRoute that names it ("service <ns>/<name> not in the parent resource
# namespace"), so the gate lives next to the application it guards. AIVAN_NS
# defaults to aivan; the proof-of-concept install on this cluster uses
# hermes-agent.
#
#   export AIVAN_NS=hermes-agent
#   envsubst < deploy/k8s.yaml | kubectl apply -f -
#
# The Secret aivan-authz-db is not in this file. It holds the runtime
# credential, and a placeholder in a manifest would overwrite a real secret on
# the next apply:
#
#   kubectl -n "$AIVAN_NS" create secret generic aivan-authz-db \
#     --from-literal AIVAN_DB_URL='postgres://aivan_authz:<pw>@aivan-core-rw.aivan-core.svc.cluster.local:5432/aivan_core?sslmode=require'
#
# The role behind it is created once, out of band, by the install step:
#
#   create role aivan_authz login nosuperuser nocreatedb nocreaterole password '<pw>';
#
# The schema and the grants belong to aivan-hud's migration history now
# (doc/schema-handover.md §2): `rake db:migrate` runs as aivan_migrations, which
# owns schema authz. There is no migrate step at boot; the gate starts, probes
# its grants, and serves.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aivan-authz-policy
data:
  policy.yaml: |
    # The body ceiling the proxy in front of the gate is configured with, in the
    # same file as the routes so the two numbers sit together. Traefik's
    # forwardAuth maxBodySize must be above AIVAN_MAX_BODY (below), or Traefik
    # answers first with its own 401 and the operator learns nothing. The gate
    # refuses to start if this is not above AIVAN_MAX_BODY.
    #
    # The documented consequence: a body between 1048577 and 2097152 bytes
    # reaches the gate and is refused by it with a 413; a body above 2097152 is
    # refused by Traefik with a 401 (S18, doc/runbook.md).
    maxBody: 2097152

    # The gated router catches every path the public router does not name, so
    # the first matching prefix is what decides. "/" is the default: a path the
    # router sends through the gate needs any known device. A path missing from
    # this table would default to the same class and log a warning.
    #
    # /__aivan/enroll is the one prefix with the enrollment class. It accepts a
    # body with no user proof because the claim carries its own: a signature
    # over a pending record's code. The class is pinned to this prefix by
    # policy.New, so a second use of it is a refusal at startup.
    hosts:
      aivan-hud.home.arpa:
        routes:
          - { prefix: /__aivan/enroll, class: enrollment }
          - { prefix: /admin,          class: admin }
          - { prefix: /,               class: authenticated }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aivan-authz
  labels: { app: aivan-authz }
spec:
  # One replica until the session table and the nonce table are shown to be
  # safe under more. Nothing in the design needs the count, and a single node
  # has nowhere else to put a second one.
  replicas: 1
  selector:
    matchLabels: { app: aivan-authz }
  template:
    metadata:
      labels: { app: aivan-authz }
    spec:
      automountServiceAccountToken: false
      # The gate's drain is 10 s (cmd/authz-gate drainTimeout), so the kubelet must
      # not SIGKILL before it finishes. Twenty seconds leaves the drain plus the
      # time between SIGTERM and the endpoint being removed from the Service.
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: authz
          image: docker.home.arpa:5000/aivan-authz:latest
          imagePullPolicy: Always
          args: ["serve"]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: AIVAN_DB_URL
              valueFrom:
                secretKeyRef: { name: aivan-authz-db, key: AIVAN_DB_URL }
            - name: AIVAN_HOSTS
              value: aivan-hud.home.arpa
            - name: AIVAN_POLICY
              value: /etc/aivan/policy.yaml
            - name: AIVAN_LISTEN
              value: ":8080"
            # The gate's own body limit (S18). Explicit rather than defaulted so
            # the number beside Traefik's maxBodySize in the Middleware and the
            # policy file is a thing an operator can compare: gate 1048576,
            # Traefik 2097152. A body of 1048577 bytes is refused here with a
            # 413; a body above 2097152 is refused by Traefik with a 401.
            - name: AIVAN_MAX_BODY
              value: "1048576"
            # Session lifetimes, spec §5.4. The idle expiry slides and is
            # written back only when it moves more than 60 s, so a busy session
            # costs at most one write a minute. The absolute cap never moves.
            - name: AIVAN_SESSION_IDLE
              value: "15m"
            - name: AIVAN_SESSION_MAX
              value: "8h"
            # Phase C: the nonce rate limiter charges a request to the client
            # address only when the peer is one of these. It must match the
            # cluster's pod CIDR, or every request is charged to Traefik's pod
            # and one noisy client spends everyone's budget.
            #
            # Observed on this cluster (2026-11-13): the node's podCIDR is
            # 192.168.196.0/24 and every pod is in it. Re-check with
            #   kubectl get nodes -o jsonpath='{.items[0].spec.podCIDR}'
            # if the cluster is rebuilt.
            - name: AIVAN_TRUSTED_PROXY_CIDRS
              value: "192.168.196.0/24"
          volumeMounts:
            - name: policy
              mountPath: /etc/aivan
              readOnly: true
            # The image's /tmp is not writable under a read-only root, and the
            # distroless image needs nothing else.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: policy
          configMap: { name: aivan-authz-policy }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aivan-authz
spec:
  selector: { app: aivan-authz }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# No Ingress and no IngressRoute for this Service. It is reached by three
# callers only: the forwardAuth address, which dials the cluster service; the
# gate router on the application's host; and `verify-signature`, which the
# application calls pod-to-pod so that its own database credential never decides
# whether a signature is good (aivan-hud lib/galaxy/signatures.rb, Gate).
# A router bound to a host of the gate's own would be a second way in.
#
# The NetworkPolicy admits Traefik and aivan-hud, on 8080, and nothing else.
# Minting an enrollment is a hud action, and `kubectl exec` with the operator
# credential is the break-glass path; neither needs a network hole here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aivan-authz-ingress
spec:
  podSelector:
    matchLabels: { app: aivan-authz }
  policyTypes: [Ingress]
  ingress:
    - from:
        # Traefik, for forwardAuth on every gated request.
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
        # The application, for /__aivan/verify-signature. A separate peer, not a
        # field merged into Traefik's: the two select different pods.
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: hermes-agent }
          podSelector:
            matchLabels: { app: aivan-hud }
      ports:
        - { protocol: TCP, port: 8080 }
---
# The gate makes outbound connections to Postgres and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aivan-authz-egress
spec:
  podSelector:
    matchLabels: { app: aivan-authz }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: aivan-core }
      ports:
        - { protocol: TCP, port: 5432 }
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# The purge is not here. Removing expired nonces and idle sessions is a
# scheduled pass over schema authz, so it lives in aivan-hud's chart with the
# project that owns that schema (aivan-hud/k8s/templates/authz-purge-cronjob.yaml).
#
# It moved for the credential. The CronJob used to run here as aivan_migrations,
# the schema owner, which doc/schema-ownership.md §3 says is "never a running
# pod". The replacement runs as aivan_core, hud's own role, with DELETE plus a
# column-level SELECT on the two predicate columns and nothing else
# (aivan-hud/db/migration/202611150100_authz_purge_grants.rb).
#
# Nothing in this file grants the gate the ability to purge: the gate holds DML
# on the scratch tables because a session ends with a delete and a nonce is
# spent by one, but the scheduled pass is administration and runs outside the
# pod (doc/schema-handover.md §5).
