# aivan-authz: the ingress auth service.
#
# Phase C adds /__aivan/verify (forwardAuth) and /__aivan/nonce. Phase D adds
# /__aivan/session, reached on the gate's own router rather than through
# forwardAuth: a cookie set on a forwardAuth 200 is not delivered to the browser
# without addAuthCookiesToResponse, and the request would have been consumed as
# an auth check. Phase E wires the middleware into aivan-hud, so this file and
# aivan-hud/deploy/routing.yaml are applied together.
#
# Namespace: Traefik refuses a Service in another namespace than the
# IngressRoute that names it ("service <ns>/<name> not in the parent resource
# namespace"), so the gate lives next to the application it guards. AIVAN_NS
# defaults to aivan; the proof-of-concept install on this cluster uses
# hermes-agent.
#
#   export AIVAN_NS=hermes-agent
#   envsubst < deploy/k8s.yaml | kubectl apply -f -
#
# The Secret aivan-authz-db is not in this file. It holds the runtime
# credential, and a placeholder in a manifest would overwrite a real secret on
# the next apply:
#
#   kubectl -n "$AIVAN_NS" create secret generic aivan-authz-db \
#     --from-literal AIVAN_DB_URL='postgres://aivan_authz:<pw>@aivan-core-rw.aivan-core.svc.cluster.local:5432/aivan_core?sslmode=require'
#
# The role behind it is created once, out of band, by the install step:
#
#   create role aivan_authz login nosuperuser nocreatedb nocreaterole password '<pw>';
#
# then `authz migrate` runs as aivan_migrations, which owns schema authz.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aivan-authz-policy
  namespace: ${AIVAN_NS}
data:
  policy.yaml: |
    # The gated router catches every path the public router does not name, so
    # the first matching prefix is what decides. "/" is the default: a path the
    # router sends through the gate needs any known device. A path missing from
    # this table would default to the same class and log a warning.
    #
    # /__aivan/enroll is the one prefix with the enrollment class. It accepts a
    # body with no user proof because the claim carries its own: a signature
    # over a pending record's code. The class is pinned to this prefix by
    # policy.New, so a second use of it is a refusal at startup.
    hosts:
      aivan-hud.home.arpa:
        routes:
          - { prefix: /__aivan/enroll, class: enrollment }
          - { prefix: /admin,          class: admin }
          - { prefix: /,               class: authenticated }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aivan-authz
  namespace: ${AIVAN_NS}
  labels: { app: aivan-authz }
spec:
  # One replica until the session table and the nonce table are shown to be
  # safe under more. Nothing in the design needs the count, and a single node
  # has nowhere else to put a second one.
  replicas: 1
  selector:
    matchLabels: { app: aivan-authz }
  template:
    metadata:
      labels: { app: aivan-authz }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: authz
          image: docker.home.arpa:5000/aivan-authz:latest
          imagePullPolicy: Always
          args: ["serve"]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: AIVAN_DB_URL
              valueFrom:
                secretKeyRef: { name: aivan-authz-db, key: AIVAN_DB_URL }
            - name: AIVAN_HOSTS
              value: aivan-hud.home.arpa
            - name: AIVAN_POLICY
              value: /etc/aivan/policy.yaml
            - name: AIVAN_LISTEN
              value: ":8080"
            # Session lifetimes, spec §5.4. The idle expiry slides and is
            # written back only when it moves more than 60 s, so a busy session
            # costs at most one write a minute. The absolute cap never moves.
            - name: AIVAN_SESSION_IDLE
              value: "15m"
            - name: AIVAN_SESSION_MAX
              value: "8h"
            # Phase C: the nonce rate limiter charges a request to the client
            # address only when the peer is one of these. It must match the
            # cluster's pod CIDR, or every request is charged to Traefik's pod
            # and one noisy client spends everyone's budget.
            #
            # Observed on this cluster (2026-11-13): the node's podCIDR is
            # 192.168.196.0/24 and every pod is in it. Re-check with
            #   kubectl get nodes -o jsonpath='{.items[0].spec.podCIDR}'
            # if the cluster is rebuilt.
            - name: AIVAN_TRUSTED_PROXY_CIDRS
              value: "192.168.196.0/24"
          volumeMounts:
            - name: policy
              mountPath: /etc/aivan
              readOnly: true
            # The image's /tmp is not writable under a read-only root, and the
            # distroless image needs nothing else.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: policy
          configMap: { name: aivan-authz-policy }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aivan-authz
  namespace: ${AIVAN_NS}
spec:
  selector: { app: aivan-authz }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# No Ingress and no IngressRoute for this Service. It is reached by two callers
# only: the forwardAuth address, which dials the cluster service, and the gate
# router on the application's host. A router bound to a host of the gate's own
# would be a second way in.
#
# The NetworkPolicy admits Traefik and nothing else. An operator minting an
# enrollment with `authz enroll-new --username … --origin … --kind browser`
# does it with the database secret through a port-forward, which
# needs no network hole here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aivan-authz-ingress
  namespace: ${AIVAN_NS}
spec:
  podSelector:
    matchLabels: { app: aivan-authz }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
      ports:
        - { protocol: TCP, port: 8080 }
---
# The gate makes outbound connections to Postgres and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aivan-authz-egress
  namespace: ${AIVAN_NS}
spec:
  podSelector:
    matchLabels: { app: aivan-authz }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: aivan-core }
      ports:
        - { protocol: TCP, port: 5432 }
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }